
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Task - StudyFlow</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="main-content">

    <section class="task-form">

        <h2>Edit Study Task</h2>

        <form method="POST">

            <label>Task Name</label>

            <input
                type="text"
                name="title"
                value="{{ task.title }}"
                required
            >

            <label>Subject</label>

            <input
                type="text"
                name="subject"
                value="{{ task.subject }}"
                required
            >

            <label>Deadline</label>

            <input
                type="date"
                name="deadline"
                value="{{ task.deadline or '' }}"
            >

            <label>Priority</label>

            <select name="priority">

                <option value="Low"
                    {% if task.priority == 'Low' %}selected{% endif %}>
                    Low
                </option>

                <option value="Medium"
                    {% if task.priority == 'Medium' %}selected{% endif %}>
                    Medium
                </option>

                <option value="High"
                    {% if task.priority == 'High' %}selected{% endif %}>
                    High
                </option>

            </select>

            <button type="submit">Save Changes</button>

            <a href="/" class="cancel-btn">Cancel</a>

        </form>

    </section>

</div>

</body>
</html>
